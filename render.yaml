services:
  - type: web
    name: pakistan-bakery-api
    runtime: python
    buildCommand: pip install -r api/requirements.txt && playwright install
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: true
      - key: PORT
        value: "8000"
    scaling:
      minInstances: 1
      maxInstances: 3
